# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pdf/**'

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Diagnostic — Check secret presence
        env:
          SECRET_VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IAR_ARCHIVE_328BC }}
        run: |
          echo "::group::Secret Diagnostics"
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ SECRET IS EMPTY — value not received"
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ Secret received. Length: ${#SECRET_VALUE} characters"

          FIRST_CHAR=$(echo "$SECRET_VALUE" | head -c 1)
          if [ "$FIRST_CHAR" = "{" ]; then
            echo "✅ Secret starts with '{' — looks like JSON"
          else
            echo "⚠️ Secret does NOT start with '{' — received first char: '$FIRST_CHAR'"
          fi

          LAST_CHAR=$(echo "$SECRET_VALUE" | tail -c 1)
          if [ "$LAST_CHAR" = "}" ]; then
            echo "✅ Secret ends with '}' — looks like complete JSON"
          else
            echo "⚠️ Secret does NOT end with '}'"
          fi

          if echo "$SECRET_VALUE" | grep -q '"type": *"service_account"'; then
            echo "✅ Contains '\"type\": \"service_account\"' — valid Firebase SA"
          else
            echo "⚠️ Missing '\"type\": \"service_account\"' — may not be a Firebase SA"
          fi

          if echo "$SECRET_VALUE" | grep -q '"project_id": *"iar-archive-328bc"'; then
            echo "✅ Contains correct project_id 'iar-archive-328bc'"
          else
            echo "⚠️ Missing or wrong project_id"
          fi
          echo "::endgroup::"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IAR_ARCHIVE_328BC }}
          channelId: live
          projectId: iar-archive-328bc
          target: iararchive
