name: Auto Extract Book Info

on:
  push:
    paths:
      - 'pdf/**'
  schedule:
    # Completes records still marked ai_status="partial" and picks up any
    # file a previous run could not finish. Runs on the default branch only.
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a running extraction: progress is only committed at the end
# of the job, so cancelling would throw away every book processed so far.
# Runs are idempotent (each run scans all of pdf/), so queued runs are safe.
concurrency:
  group: auto-process-books-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    # The script itself stops at 100 minutes (see "Run Extraction Script"),
    # leaving time to validate, commit and push.
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: true
          token: ${{ secrets.PAT_FOR_DEPLOY }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python Environment
        run: |
          python --version
          python -m pip --version
          python -m pip check

      - name: Verify API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL }}
        run: |
          has_gemini=0; has_groq=0; has_compat=0
          if [ -n "${GEMINI_API_KEY:-}" ] || [ -n "${GEMINI_API_KEYS:-}" ]; then has_gemini=1; fi
          if [ -n "${GROQ_API_KEY:-}" ] || [ -n "${GROQ_API_KEYS:-}" ]; then has_groq=1; fi
          if [ -n "${OPENAI_COMPAT_BASE_URL:-}" ]; then has_compat=1; fi

          if [ "$has_gemini$has_groq$has_compat" = "000" ]; then
            echo "::error title=Missing AI Providers::No GEMINI_API_KEY(S), GROQ_API_KEY(S) or OPENAI_COMPAT_BASE_URL is configured."
            exit 1
          fi

          [ "$has_gemini" = 1 ] && echo "✓ Gemini is configured." || echo "::warning title=Gemini Missing::Gemini is not configured."
          [ "$has_groq" = 1 ] && echo "✓ Groq is configured." || echo "::warning title=Groq Missing::Groq is not configured."
          [ "$has_compat" = 1 ] && echo "✓ OpenAI-compatible provider is configured."
          exit 0

      - name: Verify Dependencies
        run: |
          python - <<'PY'
          import anydoc
          import groq
          import pypdf
          from google import genai

          print("anydoc:", getattr(anydoc, "__version__", "unknown"))
          print("groq:", getattr(groq, "__version__", "unknown"))
          print("pypdf:", getattr(pypdf, "__version__", "unknown"))
          print("google-genai:", getattr(genai, "__version__", "unknown"))
          PY

      - name: Validate Python Syntax
        run: |
          python -m py_compile \
            process_books.py \
            migrate_books.py \
            validate_books.py

      # Raw AI answers keyed by file hash. They survive between runs, so a
      # book already analysed is never paid for twice (and survives an outage).
      - name: Restore AI Answer Cache
        uses: actions/cache@v4
        with:
          path: ai_cache
          key: ai-cache-${{ github.run_id }}
          restore-keys: |
            ai-cache-

      # Optional local OCR for scanned PDFs. Enable by creating the
      # repository variable ENABLE_OCR = true (Settings > Variables).
      - name: Install OCR Tools (optional)
        if: ${{ vars.ENABLE_OCR == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ocrmypdf tesseract-ocr tesseract-ocr-ara

      - name: Normalize Legacy Catalog
        run: |
          python migrate_books.py

      - name: Validate Catalog After Migration
        run: |
          python validate_books.py

      # continue-on-error: whatever was processed before a crash or the time
      # limit must still be validated and committed. A crash is reported by
      # the "Fail If Extraction Crashed" step at the end.
      - name: Run Extraction Script
        id: extract
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          # Optional repository variables (comma-separated model lists).
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_MODELS: ${{ vars.OPENAI_COMPAT_MODELS }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=60 100m python process_books.py
          code=$?

          if [ "$code" -eq 124 ]; then
            echo "::warning title=Time budget reached::Stopped after 100 minutes. Progress is saved; remaining files continue on the next run."
            exit 0
          fi

          exit "$code"

      - name: Validate Final Book Catalog
        run: |
          python validate_books.py

      - name: Commit and Push Changes
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: "Auto-update book catalog"
          GH_TOKEN: ${{ secrets.PAT_FOR_DEPLOY }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add books.json

          if [ -d covers ]; then
            git add covers/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "${COMMIT_MSG}"

          if ! git pull --rebase origin "${BRANCH}"; then
            echo "::error title=Rebase Failed::git pull --rebase failed on branch ${BRANCH}"
            git rebase --abort || true
            exit 1
          fi

          for i in 1 2 3; do
            if git push origin "${BRANCH}"; then
              echo "Push succeeded on attempt ${i}."
              exit 0
            fi

            echo "::warning::Push attempt ${i} failed. Retrying..."
            sleep 5
          done

          echo "::error title=Push Failed::Could not push after 3 attempts."
          exit 1

      - name: Fail If Extraction Crashed
        if: ${{ steps.extract.outcome == 'failure' }}
        run: |
          echo "::error title=Extraction Failed::process_books.py crashed. Work done before the crash was validated and committed; check the logs of the extraction step."
          exit 1

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error title=Workflow Failed::The Auto Extract Book Info workflow failed. Check logs."
