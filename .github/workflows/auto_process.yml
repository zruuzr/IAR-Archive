name: Auto Extract Book Info

on:
  push:
    paths:
      - 'pdf/*.pdf'
      - 'pdf/*.PDF'

permissions:
  contents: write

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai pypdf

      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_books.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # سحب أحدث التحديثات لتفادي حدوث تعارضات (Race Conditions)
          git pull --rebase origin main || git pull --rebase origin master || true
          
          git add books.json
          
          # التحقق مما إذا كان هناك تغيير حقيقي في الملف قبل الـ commit
          if git diff --staged --quiet; then
            echo "لم يتم العثور على أي تغييرات جديدة لتسجيلها."
            exit 0
          fi
          
          git commit -m "Auto-update books.json with new book info"
          git push
