name: Auto Extract Book Info

on:
  push:
    paths:
      - 'pdf/*.pdf'
      - 'pdf/*.PDF'

permissions:
  contents: write

# ✅ منع تداخل التشغيلات المتزامنة لحماية بيانات books.json من التلف
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ✅ إيقاف الـ Job تلقائياً إذا تجاوزت 10 دقائق لمنع استنزاف الموارد

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ✅ جلب السجل الكامل لتفادي أخطاء الـ rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai pypdf

      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_books.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ✅ سحب أحدث التحديثات باستخدام اسم الفرع الحالي ديناميكياً
          git pull --rebase origin ${{ github.ref_name }}
          
          # ✅ إضافة ملف البيانات وأي صور أغلفة جديدة تم إنشاؤها
          git add books.json covers/
          
          # التحقق مما إذا كان هناك تغيير حقيقي قبل الـ commit لمنع الـ commits الفارغة
          if git diff --staged --quiet; then
            echo "لم يتم العثور على أي تغييرات جديدة لتسجيلها."
            exit 0
          fi
          
          git commit -m "Auto-update books.json and covers with new book info"
          git push origin ${{ github.ref_name }}
