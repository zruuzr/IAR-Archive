name: Auto Extract Book Info

on:
  push:
    paths:
      - 'pdf/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-process-books-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50
          persist-credentials: true
          token: ${{ secrets.PAT_FOR_DEPLOY }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python Environment
        run: |
          python --version
          python -m pip --version
          python -m pip check

      - name: Verify API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error title=Missing AI Providers::Neither GEMINI_API_KEY nor GROQ_API_KEY is configured."
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning title=Gemini Missing::GEMINI_API_KEY is not set — Groq fallback will be used."
          else
            echo "✓ Gemini API key is configured."
          fi

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::warning title=Groq Missing::GROQ_API_KEY is not set — Gemini will be used without Groq fallback."
          else
            echo "✓ Groq API key is configured."
          fi

      - name: Verify Dependencies
        run: |
          python - <<'PY'
          import anydoc
          import groq
          import pypdf
          from google import genai

          print("anydoc:", getattr(anydoc, "__version__", "unknown"))
          print("groq:", getattr(groq, "__version__", "unknown"))
          print("pypdf:", getattr(pypdf, "__version__", "unknown"))
          print("google-genai:", getattr(genai, "__version__", "unknown"))
          PY

      - name: Validate Python Syntax
        run: |
          python -m py_compile \
            process_books.py \
            migrate_books.py \
            validate_books.py

      - name: Normalize Legacy Catalog
        run: |
          python migrate_books.py

      - name: Validate Catalog After Migration
        run: |
          python validate_books.py

      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python process_books.py

      - name: Validate Final Book Catalog
        run: |
          python validate_books.py

      - name: Commit and Push Changes
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: "Auto-update book catalog"
          GH_TOKEN: ${{ secrets.PAT_FOR_DEPLOY }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add books.json

          if [ -d covers ]; then
            git add covers/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "${COMMIT_MSG}"

          if ! git pull --rebase origin "${BRANCH}"; then
            echo "::error title=Rebase Failed::git pull --rebase failed on branch ${BRANCH}"
            git rebase --abort || true
            exit 1
          fi

          for i in 1 2 3; do
            if git push origin "${BRANCH}"; then
              echo "Push succeeded on attempt ${i}."
              exit 0
            fi

            echo "::warning::Push attempt ${i} failed. Retrying..."
            sleep 5
          done

          echo "::error title=Push Failed::Could not push after 3 attempts."
          exit 1

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error title=Workflow Failed::The Auto Extract Book Info workflow failed. Check logs."
