name: Auto Extract Book Info

on:
  push:
    paths:
      - 'pdf/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-process-books-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: true
          token: ${{ secrets.PAT_FOR_DEPLOY }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ] && [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error title=Missing AI Providers::Neither GEMINI_API_KEY nor GROQ_API_KEY is configured."
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning title=Gemini Missing::GEMINI_API_KEY is not set — Groq fallback will be used."
          else
            echo "✓ Gemini API key is configured."
          fi

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::warning title=Groq Missing::GROQ_API_KEY is not set — Gemini will be used without Groq fallback."
          else
            echo "✓ Groq API key is configured."
          fi

      - name: Verify anydoc Installation
        run: |
          python -c "import anydoc; print('anydoc:', getattr(anydoc, '__version__', 'unknown'))"

      - name: Verify Groq Installation
        run: |
          python -c "import groq; print('groq:', getattr(groq, '__version__', 'unknown'))" \
            || echo "Groq package not available"

      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python process_books.py

      - name: Validate Generated Catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("books.json")

          if not path.is_file():
              raise SystemExit("books.json was not generated.")

          if path.stat().st_size == 0:
              raise SystemExit("books.json is empty.")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"books.json contains invalid JSON: {exc}") from exc

          if not isinstance(data, list):
              raise SystemExit("books.json must contain a top-level JSON array.")

          print(f"✓ books.json validated successfully: {len(data)} records")
          PY

      - name: Commit and Push Changes
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: "Auto-update books.json with new book info"
          GH_TOKEN: ${{ secrets.PAT_FOR_DEPLOY }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add books.json

          if [ -d covers ]; then
            git add covers/
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "${COMMIT_MSG}"

          if ! git pull --rebase origin "${BRANCH}"; then
            echo "::error title=Rebase Failed::git pull --rebase failed on branch ${BRANCH}"
            git rebase --abort || true
            exit 1
          fi

          for i in 1 2 3; do
            if git push origin "${BRANCH}"; then
              echo "Push succeeded on attempt ${i}."
              exit 0
            fi

            echo "::warning::Push attempt ${i} failed. Retrying..."
            sleep 5
          done

          echo "::error title=Push Failed::Could not push after 3 attempts."
          exit 1

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error title=Workflow Failed::The Auto Extract Book Info workflow failed. Check logs."
