name: Auto Extract Book Info

on:
  push:
    paths:
      - 'pdf/*.pdf'
      - 'pdf/*.PDF'
      - 'pdf/*.zip'
      - 'pdf/*.ZIP'

permissions:
  contents: write

concurrency:
  group: auto-process-books
  cancel-in-progress: false

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai pypdf

      - name: Verify API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set in repository secrets."
            exit 1
          fi

      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_books.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ github.ref_name }}"

          git pull --rebase origin "$BRANCH" || true

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update books.json with new book info [skip ci]"
          git push origin "$BRANCH"
