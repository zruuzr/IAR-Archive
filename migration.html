<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="IAR Archive — بيئة الترحيل التقنية إلى React + Vite + TypeScript (قيد التطوير)"
    />
    <meta name="theme-color" content="#f6f2e9" />
    <title>IAR Archive | بيئة الترحيل التقنية (React + Vite)</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Cuneiform&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var l, t;
        try {
          l = localStorage.getItem('iar_lang');
          t = localStorage.getItem('iar_theme');
        } catch (_) {}
        var lang = l === 'en' ? 'en' : 'ar';
        var theme =
          t === 'dark' || t === 'light'
            ? t
            : typeof matchMedia === 'function' &&
                matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        var r = document.documentElement;
        r.setAttribute('lang', lang);
        r.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        r.setAttribute('data-theme', theme);
        r.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <script>
      window.__iarInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__iarInstallPrompt = e;
        if (typeof window.__iarPWAReady === 'function') window.__iarPWAReady(e);
      });
      window.addEventListener('appinstalled', function () {
        window.__iarInstallPrompt = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
