<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — الصفحة غير موجودة | IAR Archive</title>
    <style>
      :root {
        --canvas: #f2ede2;
        --surface: #faf7f0;
        --ink: #181715;
        --ink-muted: #5f584c;
        --terracotta: #b03e23;
        --hairline: rgba(24, 23, 21, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #131519;
          --surface: #1a1d23;
          --ink: #ece6d9;
          --ink-muted: #9c9486;
          --terracotta: #d25d3f;
          --hairline: rgba(236, 230, 217, 0.22);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          'IBM Plex Sans Arabic',
          'IBM Plex Sans',
          system-ui,
          -apple-system,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-top: 3px solid var(--terracotta);
        border-radius: 4px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      }
      .code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        color: var(--terracotta);
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--ink-muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        border-radius: 3px;
        background: var(--ink);
        color: var(--surface);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: background 0.2s ease;
      }
      a:hover {
        background: var(--terracotta);
        color: #faf7f0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">IAR ARCHIVE · ERROR 404</div>
      <h1>الصفحة المطلوبة غير موجودة</h1>
      <p>
        لم نتمكن من العثور على المسار المطلوب في الأرشيف الإداري العراقي. يمكنك العودة إلى
        الفهرس الرئيسي للبحث في المراجع والمصنفات.
      </p>
      <a href="/">العودة إلى المكتبة المرجعية · Return to Archive</a>
    </main>
  </body>
</html>
