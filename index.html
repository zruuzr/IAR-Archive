<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="IAR Archive — المكتبة الرقمية العراقية للمراجع الإدارية. ملخصات، توثيق APA، حزم بحثية."
    />
    <meta name="theme-color" content="#f6f2e9" />

    <meta property="og:title" content="IAR Archive | Iraqi Administrative Reference" />
    <meta
      property="og:description"
      content="مكتبة رقمية لأرشفة المراجع الإدارية العراقية مع ملخصات وتوثيق أكاديمي"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://iararchive.web.app/" />
    <meta
      property="og:image"
      content="https://iararchive.web.app/icons/icon-512x512.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IAR Archive" />
    <meta name="twitter:description" content="مكتبة رقمية للمراجع الإدارية" />
    <meta
      name="twitter:image"
      content="https://iararchive.web.app/icons/icon-512x512.png"
    />
    <link rel="canonical" href="https://iararchive.web.app/" />

    <title id="pageTitle">IAR Archive | Iraqi Administrative Reference</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Cuneiform&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var l, t;
        try {
          l = localStorage.getItem('iar_lang');
          t = localStorage.getItem('iar_theme');
        } catch (_) {}
        var lang = l === 'en' ? 'en' : 'ar';
        var theme =
          t === 'dark' || t === 'light'
            ? t
            : typeof matchMedia === 'function' &&
                matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        var r = document.documentElement;
        r.setAttribute('lang', lang);
        r.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        r.setAttribute('data-theme', theme);
        r.classList.toggle('dark', theme === 'dark');
      })();
    </script>

    <script>
      window.__iarInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__iarInstallPrompt = e;
        if (typeof window.__iarPWAReady === 'function') window.__iarPWAReady(e);
      });
      window.addEventListener('appinstalled', function () {
        window.__iarInstallPrompt = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var hadController = Boolean(navigator.serviceWorker.controller);
        window.addEventListener('load', async function () {
          try {
            var reg = await navigator.serviceWorker.register('/sw.js', {
              updateViaCache: 'none'
            });
            if (!reg) return;
            setInterval(
              function () {
                reg.update().catch(function () {});
              },
              60 * 60 * 1000
            );
            window.addEventListener('focus', function () {
              reg.update().catch(function () {});
            });
            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function () {
                if (
                  newWorker.state === 'installed' &&
                  navigator.serviceWorker.controller
                ) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (!hadController || refreshing) return;
              refreshing = true;
              window.location.reload();
            });
          } catch (e) {
            console.error('SW registration failed:', e);
          }
        });
      }
    </script>
  </body>
</html>
